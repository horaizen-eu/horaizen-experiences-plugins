name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Marketplace
        run: claude plugin validate --strict .
      - name: Plugins (directory profile)
        run: |
          for plugin in horaizen-experiences horaizen-staff; do
            claude plugin validate --profile directory "$plugin"
          done
