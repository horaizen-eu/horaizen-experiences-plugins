name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Marketplace
        run: claude plugin validate --strict .
      - name: Plugins (directory profile)
        run: |
          for plugin in horaizen-experiences horaizen-staff; do
            claude plugin validate --profile directory --strict "$plugin"
          done
      - name: Release skill
        run: claude plugin validate --strict .claude
      - name: ChatGPT package
        working-directory: openai/horaizen-experiences
        run: |
          python3 -c "import json; [json.load(open(f)) for f in ('plugin.json', 'mcp.json')]"
          python3 -m zipfile -c "$RUNNER_TEMP/chatgpt.zip" plugin.json mcp.json skills assets
          python3 -m zipfile -t "$RUNNER_TEMP/chatgpt.zip"
